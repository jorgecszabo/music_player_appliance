# Board description: LinkSprite pcDuino Lite (Allwinner A10, Cortex-A8 1 GHz,
# 512 MB, microSD only). The same board as the pcDuino (v1) without the NAND and
# with half the RAM, so it uses the pcDuino's device tree.
# Shell syntax. Sourced by the build scripts and the mkimage profile, and
# installed on the board as /etc/panda/board.conf, where the appliance services
# read it. The appliance code must take hardware details from here, never
# hardcode them.
#
# Values marked "unverified" come from the kernel/U-Boot sources (the device
# tree and the drivers) and still need checking on the board (PCDUINO.md, B1-B6).

BOARD=pcduino
BOARD_NAME="pcDuino Lite (Allwinner A10)"
# Web page: the "about" line and a footer badge (optional).
BOARD_BLURB="an upcycled 2013 pcDuino Lite"
BOARD_BADGE="A10"

# --- Build / boot -------------------------------------------------------------
ALPINE_ARCH=armv7
KERNEL_FLAVOR=pcduino
KERNEL_PACKAGE=linux-pcduino
DTB=sun4i-a10-pcduino.dtb
# UART0 on the debug header (3.3 V), the device tree's serial0.
CONSOLE=ttyS0,115200n8
# FAT boot partition: label given by write-sdcard.sh (11 characters, the FAT
# maximum), and the device that holds the lbu overlay and the apk cache. The
# Lite has no NAND: microSD (mmc0, the only MMC host enabled) only.
BOOT_LABEL=PCDUINOBOOT
BOOT_MEDIA=mmcblk0p1
MODLOOP_EXTRA_FIRMWARE=""
# Extra packages for this board's local repository on the card.
BOARD_PACKAGES=""
# U-Boot (scripts/build-u-boot.sh). Same release as the other boards (one source
# tree). The SPL sizes the DRAM itself (512 MB on the Lite, 1 GB on the pcDuino).
UBOOT_TAG=v2024.07
UBOOT_DEFCONFIG=Linksprite_pcDuino_defconfig
# SPL + U-Boot in one file, written raw at 8 KiB (scripts/write-sdcard-sunxi.sh).
UBOOT_FILES="u-boot-sunxi-with-spl.bin"

# --- Audio --------------------------------------------------------------------
# No onboard output: no 3.5 mm jack (the A10 codec's pins aren't wired out), and
# mainline's A10 HDMI driver carries no sound. The appliance plays through the
# first USB audio card (board.conf of other boards: AUDIO_CARD empty = USB).
AUDIO_CARD=""
AUDIO_DEVICE=""
AUDIO_RATE=""
AUDIO_FORMAT=S16_LE
AUDIO_CHANNELS=2
AUDIO_MIXER=""
# The volume cap needs a hardware control on a known card: none here.
AUDIO_HW_VOLUME_CONTROL=""
AUDIO_HW_VOLUME_MAX=""
AUDIO_HW_VOLUME_STEP_DB=""
AUDIO_PW_SINK=""

# --- Bluetooth ----------------------------------------------------------------
# No onboard radio: a USB dongle.
BT_CONTROLLER=hci0
BT_DESCRIPTION="USB dongle"

# --- Wi-Fi --------------------------------------------------------------------
# No onboard radio: USB adapters only (nothing to set). Onboard 10/100 Ethernet
# (A10 EMAC).

# --- Button and LEDs ----------------------------------------------------------
# The pcDuino's device tree has three gpio-keys (input device "gpio-keys",
# KEY_BACK / KEY_HOME / KEY_MENU on PH17-PH19, active low, no pull-up). Whether
# the Lite has them fitted is unverified. A missing button's floating line could
# read as held at power-on, which means a FACTORY RESET here, so the button
# stays off until checked on the board (PCDUINO.md, B2). Then:
#   BUTTON_INPUT_NAME=gpio-keys
#   BUTTON_KEY=KEY_HOME
BUTTON_INPUT_NAME=""
BUTTON_KEY=""
# The TX/RX LEDs (PH15/PH16, gpio-leds). Unverified that the Lite has them.
LED_STATUS=pcduino:green:tx
LED_BT=pcduino:green:rx

# --- Watchdog -----------------------------------------------------------------
# A10 watchdog (sunxi_wdt, resets the SoC); the only one (the AXP209 driver
# registers none). Unverified.
WATCHDOG_DEV=/dev/watchdog0

# --- Sensors ------------------------------------------------------------------
# A10 temperature sensor in the touchscreen controller (sun4i-ts), zone
# "cpu-thermal" in sun4i-a10.dtsi. Unverified.
THERMAL_ZONE_TYPE=cpu-thermal
