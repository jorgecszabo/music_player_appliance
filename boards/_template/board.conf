# Board description TEMPLATE. Copy boards/_template to boards/<board>/, rename
# mkimg.TEMPLATE.sh to mkimg.<board>.sh, and fill this in. Shell syntax.
# Sourced by the build scripts and the mkimage profile, and installed on the
# device as /etc/panda/board.conf, where the appliance services read it. The
# appliance code takes every hardware detail from here.
#
# Example values: a hypothetical aarch64 board with a USB DAC. Optional
# variables say so; leave them empty or unset for the generic default.

BOARD=myboard                           # = the directory name under boards/ ([a-z][a-z0-9_]*:
                                        #   it names shell functions in the mkimage profile)
BOARD_NAME="My Board (SoC name)"
# Web page (optional): the "about" line and a footer badge.
BOARD_BLURB="an upcycled My Board"
BOARD_BADGE="SOC"

# --- Build / boot -------------------------------------------------------------
ALPINE_ARCH=aarch64                     # armv7 | aarch64 | x86_64 (container platform)
KERNEL_FLAVOR=lts                       # Alpine's flavor, or your own aport's
KERNEL_PACKAGE=linux-lts                # build your own in boards/<board>/aports/
DTB=vendor/myboard.dtb                  # relative to /boot/dtbs-<flavor>/ (ARM)
CONSOLE=ttyS0,115200n8                  # serial console (the debugging lifeline)
BOOT_LABEL=SPEAKERBOOT                  # FAT label given by the card writer
BOOT_MEDIA=mmcblk0p1                    # device with the lbu overlay + apk cache
MODLOOP_EXTRA_FIRMWARE=""               # firmware the modloop needs but modinfo doesn't declare
BOARD_PACKAGES=""                       # extra packages for the card's repository
UBOOT_TAG=v2024.07                      # U-Boot release (scripts/build-u-boot.sh)
UBOOT_DEFCONFIG=myboard_defconfig       # from U-Boot's configs/
UBOOT_FILES="u-boot.bin"                # build outputs the card writer installs
OTA_BOOT_SCHEME=""                      # optional: extlinux (default, U-Boot) or rpi
                                        #   (Raspberry Pi GPU firmware: config.txt + slot.txt)

# --- Audio --------------------------------------------------------------------
# The board's own output. USB audio cards work on every board as an alternative
# output (web page "Output device"; the kernel needs CONFIG_SND_USB_AUDIO). A
# board without onboard audio: leave AUDIO_CARD and AUDIO_PW_SINK empty, and the
# appliance plays through the first USB card.
AUDIO_CARD=Device                       # ALSA card id (/proc/asound/<id>)
AUDIO_CARD_NAME=""                      # optional: the card's name if it isn't the id, as PipeWire
                                        #   shows it (api.alsa.card.name; /proc/asound/cards after " - ")
AUDIO_DEVICE=hw:Device,0
AUDIO_RATE=""                           # optional: fixed hardware rate (e.g. 96000); empty = 44.1/48 kHz
AUDIO_FORMAT=S32_LE
AUDIO_CHANNELS=2
# amixer settings applied at boot, "control=value" per line (optional).
AUDIO_MIXER=""
# Hardware output gain = the volume cap ("Max volume" on the web page). Optional:
# without it, there's no cap (software volume only).
AUDIO_HW_VOLUME_CONTROL=""              # e.g. PCM / Headphone / Speaker
AUDIO_HW_VOLUME_MAX=""                  # highest step = 0 dB
AUDIO_HW_VOLUME_STEP_DB=""              # dB per step
# PipeWire's node name for the output (the tone filter plays into it). Find it
# on the device: wpctl status / pw-cli ls Node.
AUDIO_PW_SINK=alsa_output.usb-Vendor_Device-00.analog-stereo
# Optional: graph quantum (frames). Default 1024.
AUDIO_QUANTUM=""
# Optional: extra WirePlumber properties for the output node (codec quirks),
# SPA-JSON, one per line. See boards/pandaboard/board.conf for an example.
AUDIO_OUTPUT_PROPS=""

# --- Wi-Fi (USB adapters need nothing here) ----------------------------------------
WIFI_ONBOARD_DESCRIPTION=""              # optional: shown for a non-USB Wi-Fi adapter
WIFI_ONBOARD_BANDS=""                    # optional: e.g. "2.4 GHz" if the driver lists bands the chip can't use
WIFI_MAC_FROM=""                         # optional: interface to derive a stable onboard Wi-Fi MAC from
BT_DRIVER_AFTER_WIFI=""                  # optional: combo chip whose BT dies if Wi-Fi powers up later:
                                         #   BT driver module to load only after the onboard Wi-Fi is up

# --- Bluetooth ----------------------------------------------------------------
BT_CONTROLLER=hci0
BT_DESCRIPTION="USB dongle (BT 5.x)"
BT_CONTROLLER_MODE=""                   # optional: bredr for BR/EDR-only controllers; default dual
BT_RX_BUFFER=""                         # optional: A2DP jitter buffer in samples; default 8192

# --- Front panel (optional) -----------------------------------------------------
# A small 320x240 screen with touch and buttons: panda-lcd draws a Win98-style
# panel on it (boards/rpi1 has one). Leave LCD_FB empty for none. The panel
# needs py3-pillow and py3-qrcode in BOARD_PACKAGES.
LCD_FB=""                               # framebuffer, 320x240, 16 or 32 bpp: /dev/fbN or the
                                        #   driver name (/sys/class/graphics/fb*/name)
LCD_TOUCH_NAME=""                       # evdev name of the touchscreen
LCD_MODULES=""                          # optional: modules to load before the panel starts
LCD_KEYS_NAME=""                        # evdev name of the buttons (media keys)
LCD_BACKLIGHT=""                        # /sys/class/backlight name

# --- Services -----------------------------------------------------------------
# Spotify Connect (Spotify Soloist). Soloist and its glibc runtime exist for
# armv7, aarch64 and x86_64 only. Optional: "no" leaves Spotify out (no service,
# no runtime on the card, no settings on the web page); default yes.
SPOTIFY=""

# --- Button and LEDs ----------------------------------------------------------
# Pairing button (and factory reset when held at power-on): an evdev device
# name and key (cat /proc/bus/input/devices). Optional.
BUTTON_INPUT_NAME=gpio_keys
BUTTON_KEY=BTN_0
LED_STATUS=""                           # /sys/class/leds name: heartbeat (optional)
LED_BT=""                               # /sys/class/leds name: Bluetooth state (optional)

# --- Watchdog -----------------------------------------------------------------
WATCHDOG_DEV=/dev/watchdog0             # the SoC watchdog that resets the board
WATCHDOG_TIMEOUT=""                     # optional, seconds; default 60

# --- Sensors ------------------------------------------------------------------
THERMAL_ZONE_TYPE=cpu-thermal           # /sys/class/thermal/*/type of the CPU zone
