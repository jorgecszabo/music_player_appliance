# Appliance: recover by rebooting instead of hanging or limping along.
# Reboot 10 s after a kernel panic (Alpine's default is 120 s).
kernel.panic = 10
# A kernel oops (e.g. a driver bug) leaves the system half-broken: panic, so
# it reboots. The hardware watchdog (busybox watchdog) covers full hangs.
kernel.panic_on_oops = 1
