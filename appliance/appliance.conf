# Appliance identity (board-independent). Shell syntax. Installed on the
# board as /etc/panda/appliance.conf.
HOSTNAME=panda
# Friendly name shown by Spotify Connect, Bluetooth, AirPlay and mDNS.
SPEAKER_NAME=Panda
# Admin login user (SSH key only, doas nopass).
ADMIN_USER=panda
# Alpine package mirror for the online repositories (setup.sh adds main and
# community for the installed release).
ALPINE_MIRROR=https://dl-cdn.alpinelinux.org/alpine
# Chime level: linear stream volume (0-1), mixed over the music.
CHIME_VOLUME=0.3
