# Board description: Raspberry Pi 1 Model B rev 2 (BCM2835, ARM1176JZF-S,
# 700 MHz overclocked to 1 GHz, 512 MB) with an Adafruit 2.8" 320x240 TFT
# (ILI9341 display + STMPE610 resistive touch on SPI0, 4 buttons).
# Shell syntax. Sourced by the build scripts and the mkimage profile, and
# installed on the board as /etc/panda/board.conf, where the appliance services
# read it. The appliance code must take hardware details from here, never
# hardcode them.
#
# Values marked "unverified" come from the downstream (Raspberry Pi) kernel's
# device trees and drivers and still need checking on the board (RPI1.md, B1-B6).

BOARD=rpi1
BOARD_NAME="Raspberry Pi 1 Model B (BCM2835)"
# Web page: the "about" line and a footer badge (optional).
BOARD_BLURB="an upcycled 2012 Raspberry Pi"
BOARD_BADGE="ARM11"

# --- Build / boot -------------------------------------------------------------
# ARMv6 (no NEON): Alpine's armhf, not armv7.
ALPINE_ARCH=armhf
# Alpine's own Raspberry Pi kernel (the downstream tree): it has the TFT and
# button overlays, the dwc_otg USB driver and the jack's snd_bcm2835.
KERNEL_FLAVOR=rpi
KERNEL_PACKAGE=linux-rpi
# Empty: the GPU firmware loads the device tree (bcm2708-rpi-b.dtb for a
# Model B rev 2) and applies the overlays in config.txt; U-Boot passes it on
# (no FDT line in extlinux = U-Boot's $fdt_addr). The DTBs and overlays sit in
# the FAT root, outside the OTA slots (as MLO does on the OMAP boards).
DTB=""
# PL011 UART on GPIO 14/15 (header pins 8/10). Unverified.
CONSOLE=ttyAMA0,115200n8
BOOT_LABEL=RPIBOOT
BOOT_MEDIA=mmcblk0p1
MODLOOP_EXTRA_FIRMWARE=""
# The front panel (panda-lcd): drawing, the QR code, the spectrum (aports/panda-spectrum).
BOARD_PACKAGES="py3-pillow py3-qrcode panda-spectrum"
# U-Boot (scripts/build-u-boot.sh): rpi_defconfig is the BCM2835 Pi 1 (Model A,
# B, B+). The GPU firmware starts it as the "kernel" (config.txt
# kernel=u-boot.bin); it reads extlinux like the other boards.
UBOOT_TAG=v2024.07
UBOOT_DEFCONFIG=rpi_defconfig
UBOOT_FILES="u-boot.bin"

# --- Firmware (config.txt, written by mkimg.rpi1.sh) ---------------------------
# The "Turbo" preset (RPI1.md, S1): 1 GHz ARM, 500 MHz core, 600 MHz SDRAM, +6
# (0.15 V). No force_turbo: dynamic clocking idles at 700 MHz, and force_turbo
# with over_voltage sets the warranty bit. If S1 isn't stable: "High",
# 950/450/450/6.
RPI_ARM_FREQ=1000
RPI_CORE_FREQ=500
RPI_SDRAM_FREQ=600
RPI_OVER_VOLTAGE=6
# GPU memory (MB): the screen is on SPI and nothing uses the GPU. 32 keeps the
# full start.elf (16 would switch to the cut-down one: untested with the jack).
RPI_GPU_MEM=32

# --- Front panel (the 2.8" TFT, RPI1.md task 6) -----------------------------------
# Optional: a board without a panel leaves LCD_FB empty (no panda-lcd).
# fbtft from the pitft28-resistive overlay: "fb_ili9340", 320x240, 16 bpp (seen
# on the board, 2026-11-05).
# By driver name: it's fb2 when U-Boot passes on its HDMI simplefb (fb1).
LCD_FB=fb_ili9340
# evdev names (cat /proc/bus/input/devices): panda-keys seen on the board.
LCD_TOUCH_NAME=stmpe-ts
# stmpe-ts has no device-tree alias (only platform:stmpe-ts), so udev never
# loads it for the overlay's st,stmpe-ts node (seen on the board).
LCD_MODULES=stmpe-ts
LCD_KEYS_NAME=panda-keys            # boards/rpi1/panda-keys.dts
# /sys/class/backlight name: gpio-backlight on STMPE GPIO 2 (seen on the board).
LCD_BACKLIGHT=soc:backlight

# --- Audio --------------------------------------------------------------------
# The 3.5 mm jack: PWM from the GPU through snd_bcm2835 (VCHIQ), roughly 11-bit
# and some hiss. USB audio is the alternative ("Output device" on the web page).
# Card id and node name unverified (RPI1.md, B3).
AUDIO_CARD=Headphones
# Its name isn't its id ("bcm2835 Headphones"), and PipeWire matches by name
# (both seen on the board in /proc/asound/cards).
AUDIO_CARD_NAME="bcm2835 Headphones"
AUDIO_DEVICE=hw:Headphones,0
# Empty: 44.1 or 48 kHz as the source plays. A fixed rate would make PipeWire
# resample AirPlay on a core that has none to spare.
AUDIO_RATE=""
AUDIO_FORMAT=S16_LE
AUDIO_CHANNELS=2
AUDIO_MIXER=""
# Volume cap: snd_bcm2835's "PCM" control. Range and dB step to be measured on
# the board (B3); until then no cap (software volume only).
AUDIO_HW_VOLUME_CONTROL=""
AUDIO_HW_VOLUME_MAX=""
AUDIO_HW_VOLUME_STEP_DB=""
# Unverified: check with wpctl status / pw-cli ls Node.
AUDIO_PW_SINK=alsa_output.platform-bcm2835_audio.stereo-fallback

# --- Bluetooth ----------------------------------------------------------------
# No onboard radio: a USB dongle.
BT_CONTROLLER=hci0
BT_DESCRIPTION="USB dongle"

# --- Wi-Fi --------------------------------------------------------------------
# No onboard radio, and no dongle for now: onboard 10/100 Ethernet (smsc95xx,
# on the same USB controller as the two ports).

# --- Services -----------------------------------------------------------------
# Soloist and its Debian runtime are ARMv7: no Spotify on the ARM1176.
SPOTIFY=no

# --- Button and LEDs ----------------------------------------------------------
# The panel's 4 buttons are media keys (panda-keys): no pairing/factory-reset
# button. Pairing is in the panel's Start menu; factory reset on the web page.
BUTTON_INPUT_NAME=""
BUTTON_KEY=""
# The green ACT LED (the B's only CPU-controlled LED). Unverified name.
LED_STATUS=ACT
LED_BT=""

# --- Watchdog -----------------------------------------------------------------
# bcm2835_wdt (the PM block's watchdog, resets the SoC). Unverified.
WATCHDOG_DEV=/dev/watchdog0

# --- Sensors ------------------------------------------------------------------
# bcm2835_thermal. Unverified.
THERMAL_ZONE_TYPE=cpu-thermal
