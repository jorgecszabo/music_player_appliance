# Board description: PandaBoard rev A1 (OMAP4430-GP ES2.1).
# Shell syntax. Sourced by the build scripts and the mkimage profile, and
# installed on the board as /etc/panda/board.conf, where the appliance services
# read it. The appliance code must take hardware details from here, never
# hardcode them.

BOARD=pandaboard
BOARD_NAME="PandaBoard (OMAP4430)"

# --- Build / boot -------------------------------------------------------------
ALPINE_ARCH=armv7
KERNEL_FLAVOR=pandaboard
KERNEL_PACKAGE=linux-pandaboard
DTB=omap4-panda.dtb
CONSOLE=ttyS2,115200n8
# FAT boot partition: label given by write-sdcard.sh, and the device that holds
# the lbu overlay and the apk cache.
BOOT_LABEL=PANDABOOT
BOOT_MEDIA=mmcblk0p1
# Firmware the modloop needs but modinfo doesn't declare (hci_ll builds the
# name at runtime).
MODLOOP_EXTRA_FIRMWARE="ti-connectivity/TIInit_7.2.31.bts.zst"
# Extra packages for this board's local repository on the card.
BOARD_PACKAGES=""

# --- Audio --------------------------------------------------------------------
# TWL6040 via McPDM: only 88.2/96 kHz, S32_LE. The high-performance PLL
# (38.4 MHz mclk) allows 96 kHz only.
AUDIO_CARD=PandaBoard
AUDIO_DEVICE=hw:PandaBoard,0
AUDIO_RATE=96000
AUDIO_FORMAT=S32_LE
AUDIO_CHANNELS=2
# amixer controls applied at boot, one "control=value" per line. The audio-out
# jack is on the headset path; the AUX line-out path stays off.
AUDIO_MIXER="PLL Selection=High-Performance
Headset Left Playback=HS DAC
Headset Right Playback=HS DAC
Headset=10
Handsfree Left Playback=Off
Handsfree Right Playback=Off
AUXL=off
AUXR=off"
# Highest value of the hardware volume control above (the speaker volume
# itself is software volume in PipeWire).
AUDIO_HW_VOLUME_MAX=15

# --- Bluetooth ----------------------------------------------------------------
# Onboard TI WL1271 (BT 2.1 + EDR) on UART2 via serdev/hci_ll; comes up as hci0.
BT_CONTROLLER=hci0
BT_DESCRIPTION="TI WL1271 (BT 2.1+EDR, onboard)"

# --- Button and LEDs ----------------------------------------------------------
# Button S2 (GPIO 121): gpio-keys input device, key BTN_0.
BUTTON_INPUT_NAME=gpio_keys
BUTTON_KEY=BTN_0
LED_STATUS=pandaboard::status1
LED_ACTIVITY=pandaboard::status2

# --- Sensors ------------------------------------------------------------------
THERMAL_ZONE_TYPE=cpu_thermal
