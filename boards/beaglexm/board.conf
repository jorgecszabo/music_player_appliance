# Board description: BeagleBoard-xM (TI DM3730, Cortex-A8 1 GHz, 512 MB).
# Shell syntax. Sourced by the build scripts and the mkimage profile, and
# installed on the board as /etc/panda/board.conf, where the appliance services
# read it. The appliance code must take hardware details from here, never
# hardcode them.
#
# Values marked "unverified" come from the kernel/U-Boot sources and still
# need checking on the board.

BOARD=beaglexm
BOARD_NAME="BeagleBoard-xM (DM3730)"
# Web page: the "about" line and a footer badge (optional).
BOARD_BLURB="an upcycled 2010 BeagleBoard-xM"
BOARD_BADGE="OMAP3"

# --- Build / boot -------------------------------------------------------------
ALPINE_ARCH=armv7
KERNEL_FLAVOR=beaglexm
KERNEL_PACKAGE=linux-beaglexm
# Empty: extlinux uses FDTDIR, and U-Boot's findfdt picks the DTB for the board
# revision (omap3-beagle-xm-ab.dtb for rev A/B, omap3-beagle-xm.dtb for rev C;
# they differ in the USB hub power polarity, so Ethernet needs the right one).
DTB=""
CONSOLE=ttyS2,115200n8
# FAT boot partition: label given by write-sdcard.sh, and the device that holds
# the lbu overlay and the apk cache. The xM has no NAND/eMMC: microSD only.
BOOT_LABEL=BEAGLEBOOT
BOOT_MEDIA=mmcblk0p1
MODLOOP_EXTRA_FIRMWARE=""
# Extra packages for this board's local repository on the card.
BOARD_PACKAGES=""
# U-Boot (scripts/build-u-boot.sh). Same release as the Panda (one source tree);
# omap3_beagle covers the xM and detects its revision (beaglerev, findfdt).
UBOOT_TAG=v2024.07
UBOOT_DEFCONFIG=omap3_beagle_defconfig
UBOOT_FILES="MLO u-boot.img"

# --- Audio --------------------------------------------------------------------
# TWL4030 (TPS65950) on McBSP2, 3.5 mm "audio out" jack on the headset outputs
# (HSOL/HSOR). 8-48 kHz natively, so no fixed rate. Unverified: format, mixer
# path and the PipeWire node name.
AUDIO_CARD=omap3beagle
AUDIO_DEVICE=hw:omap3beagle,0
AUDIO_RATE=""
AUDIO_FORMAT=S16_LE
AUDIO_CHANNELS=2
# amixer controls applied at boot, one "control=value" per line. Stereo I2S
# lands on the RX L2/R2 path; route it to the headset driver (unverified).
AUDIO_MIXER="HeadsetL Mixer AudioL2=on
HeadsetR Mixer AudioR2=on
DAC2 Analog=on"
# Hardware output gain = the volume cap. Headset Playback Volume: 0 = mute,
# 1..3 = -12/-6/0 dB.
AUDIO_HW_VOLUME_CONTROL=Headset
AUDIO_HW_VOLUME_MAX=3
AUDIO_HW_VOLUME_STEP_DB=6
# PipeWire's node for the output (the tone filter plays into it). Unverified:
# check with wpctl status / pw-cli ls Node.
AUDIO_PW_SINK=alsa_output.platform-sound.stereo-fallback

# --- Bluetooth ----------------------------------------------------------------
# No onboard radio: a USB dongle.
BT_CONTROLLER=hci0
BT_DESCRIPTION="USB dongle"

# --- Wi-Fi --------------------------------------------------------------------
# No onboard radio: USB adapters only (nothing to set).

# --- Button and LEDs ----------------------------------------------------------
# USER button (GPIO 4): gpio-keys, linux,code 0x114 = BTN_EXTRA. The input
# device name comes from the DT node (gpio_keys); unverified.
BUTTON_INPUT_NAME=gpio_keys
BUTTON_KEY=BTN_EXTRA
# USR0/USR1 LEDs (D6/D7).
LED_STATUS=beagleboard::usr0
LED_BT=beagleboard::usr1

# --- Watchdog -----------------------------------------------------------------
# OMAP3 WDT2 (omap_wdt). The TWL4030 watchdog (module) may show up as another
# watchdogN; unverified that WDT2 is watchdog0.
WATCHDOG_DEV=/dev/watchdog0

# --- Sensors ------------------------------------------------------------------
# DM3730 bandgap (OMAP3_THERMAL; coarse and known to be imprecise).
THERMAL_ZONE_TYPE=cpu-thermal
