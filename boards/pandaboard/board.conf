# Board description: PandaBoard rev A1 (OMAP4430-GP ES2.1).
# Shell syntax. Sourced by the build scripts and the mkimage profile, and
# installed on the board as /etc/panda/board.conf, where the appliance services
# read it. The appliance code must take hardware details from here, never
# hardcode them.

BOARD=pandaboard
BOARD_NAME="PandaBoard (OMAP4430)"
# Web page: the "about" line and a footer badge (optional).
BOARD_BLURB="an upcycled 2011 PandaBoard"
BOARD_BADGE="OMAP4"

# --- Build / boot -------------------------------------------------------------
ALPINE_ARCH=armv7
KERNEL_FLAVOR=pandaboard
KERNEL_PACKAGE=linux-pandaboard
DTB=omap4-panda.dtb
CONSOLE=ttyS2,115200n8
# FAT boot partition: label given by write-sdcard.sh, and the device that holds
# the lbu overlay and the apk cache.
BOOT_LABEL=PANDABOOT
BOOT_MEDIA=mmcblk0p1
# Firmware the modloop needs but modinfo doesn't declare (hci_ll builds the
# name at runtime).
# (wlcore's NVS file isn't declared either.)
MODLOOP_EXTRA_FIRMWARE="ti-connectivity/TIInit_7.2.31.bts.zst ti-connectivity/wl127x-nvs.bin.zst"
# Extra packages for this board's local repository on the card.
BOARD_PACKAGES=""
# U-Boot (scripts/build-u-boot.sh): v2024.07 is the last release with omap4_panda.
UBOOT_TAG=v2024.07
UBOOT_DEFCONFIG=omap4_panda_defconfig
UBOOT_FILES="MLO u-boot.img"

# --- Audio --------------------------------------------------------------------
# TWL6040 via McPDM: only 88.2/96 kHz, S32_LE. The high-performance PLL
# (38.4 MHz mclk) allows 96 kHz only.
AUDIO_CARD=PandaBoard
AUDIO_DEVICE=hw:PandaBoard,0
AUDIO_RATE=96000
AUDIO_FORMAT=S32_LE
AUDIO_CHANNELS=2
# amixer controls applied at boot, one "control=value" per line. The audio-out
# jack is on the headset path; the AUX line-out path stays off.
AUDIO_MIXER="PLL Selection=High-Performance
Headset Left Playback=HS DAC
Headset Right Playback=HS DAC
Headset=10
Handsfree Left Playback=Off
Handsfree Right Playback=Off
AUXL=off
AUXR=off"
# PipeWire graph quantum (frames at AUDIO_RATE). The McPDM/TWL6040 path wants big
# periods (see AUDIO_OUTPUT_PROPS).
AUDIO_QUANTUM=2048
AUDIO_MIN_QUANTUM=1024
AUDIO_MAX_QUANTUM=4096
# Extra WirePlumber properties for the ALSA output node (SPA-JSON, one per line).
# TWL6040 quirks: it crackles whenever the PCM is open without data (idle-open,
# or during a suspend timeout), so never suspend and keep the graph running from
# boot (idle = real silence). And interrupt-driven scheduling: the McPDM/sDMA
# position is too coarse for timer-based scheduling (about 3 underruns/s).
AUDIO_OUTPUT_PROPS="session.suspend-timeout-seconds = 0
node.pause-on-idle = false
node.always-process = true
api.alsa.disable-tsched = true
api.alsa.period-size = 2048
api.alsa.period-num = 4"

# Hardware output gain: the volume cap ("Max volume" on the web page; the
# volume itself is software volume in PipeWire). Steps of AUDIO_HW_VOLUME_STEP_DB,
# 0..AUDIO_HW_VOLUME_MAX, where MAX = 0 dB. The cap from /etc/panda/audio.conf
# overrides this control's value in AUDIO_MIXER.
AUDIO_HW_VOLUME_CONTROL=Headset
AUDIO_HW_VOLUME_MAX=15
AUDIO_HW_VOLUME_STEP_DB=2
# PipeWire's node for the output (the tone filter plays into it).
AUDIO_PW_SINK=alsa_output.platform-sound.stereo-fallback

# --- Bluetooth ----------------------------------------------------------------
# Onboard TI WL1271 (BT 2.1 + EDR) on UART2 via serdev/hci_ll; comes up as hci0.
BT_CONTROLLER=hci0
# BR/EDR only: the WL1271 is BT 2.1 (no LE).
BT_CONTROLLER_MODE=bredr
BT_DESCRIPTION="TI WL1271 (BT 2.1+EDR, onboard)"

# --- Wi-Fi --------------------------------------------------------------------
# Onboard TI WL1271 on SDIO (MMC5), 802.11b/g/n 2.4 GHz only, sharing its antenna
# with Bluetooth (the firmware time-shares them: an A2DP stream and busy Wi-Fi
# both suffer). USB adapters are preferred when plugged in (panda-wifi "auto").
WIFI_ONBOARD_DESCRIPTION="TI WL1271 (802.11b/g/n, 2.4 GHz, onboard)"
# The generic NVS file claims 5 GHz (the driver lists 5 GHz channels), but the
# WL1271 has no 5 GHz radio: what the web page shows.
WIFI_ONBOARD_BANDS="2.4 GHz"
# Its fuse MAC address is empty, so the driver picks a random one every boot:
# derive a stable one from the Ethernet MAC (which U-Boot derives from the die ID).
WIFI_MAC_FROM=eth0
# Shared chip: powering the Wi-Fi half up or down while Bluetooth runs resets
# the WL1271 under the BT firmware (BT dead until the power is cut). So the BT
# driver loads only after the onboard Wi-Fi is up (panda-radio-init), and the
# onboard interface is never taken down again.
BT_DRIVER_AFTER_WIFI=hci_uart

# --- Button and LEDs ----------------------------------------------------------
# Button S2 (GPIO 121): gpio-keys input device, key BTN_0.
BUTTON_INPUT_NAME=gpio_keys
BUTTON_KEY=BTN_0
# LED_STATUS: heartbeat while running. LED_BT: Bluetooth state (off = idle,
# on = connected, fast blink = pairing window, slow blink = forgetting devices).
LED_STATUS=pandaboard::status1
LED_BT=pandaboard::status2

# --- Watchdog -----------------------------------------------------------------
# OMAP4 WDT2 (4a314000.wdt, MPU watchdog: resets the whole chip). watchdog1 is
# WDT3 in the audio back-end domain; not used.
WATCHDOG_DEV=/dev/watchdog0

# --- Sensors ------------------------------------------------------------------
THERMAL_ZONE_TYPE=cpu_thermal
