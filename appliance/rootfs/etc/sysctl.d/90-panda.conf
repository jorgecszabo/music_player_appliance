# Appliance: recover by rebooting instead of hanging or limping along.
# Reboot 10 s after a kernel panic (Alpine's default is 120 s).
kernel.panic = 10
# A kernel oops (e.g. a driver bug) leaves the system half-broken: panic, so
# it reboots. The hardware watchdog (busybox watchdog) covers full hangs.
kernel.panic_on_oops = 1

# Ethernet and Wi-Fi are often up at once, on the same subnet. Linux's default
# "weak host" ARP lets either interface answer for both addresses (ARP flux):
# the router and other hosts then send Wi-Fi traffic to eth0's MAC, and strict
# reverse-path filtering drops what does arrive on the Wi-Fi interface (its
# route back goes via eth0). Each interface answers ARP only for its own
# address, announces only its own address, and rp_filter is loose (any route
# back is fine). The kernel uses the higher of "all" and the per-interface
# value for these three, so "all" also covers a USB adapter plugged in later.
net.ipv4.conf.all.arp_ignore = 1
net.ipv4.conf.all.arp_announce = 2
net.ipv4.conf.all.rp_filter = 2
net.ipv4.conf.default.rp_filter = 2
